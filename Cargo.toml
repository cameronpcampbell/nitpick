[package]
name = "nitpick"
version = "0.1.0"
edition = "2024"

# Run inline module tests as integration targets so Cargo supplies the binary.
[[bin]]
name = "nitpick"
path = "src/main.rs"
test = false

[[test]]
name = "cli"
path = "src/cli.rs"

[[test]]
name = "rustfmt"
path = "src/rustfmt.rs"

[[test]]
name = "format"
path = "src/format.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ra_ap_syntax = "=0.0.349"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tempfile = "3"
toml = "0.9"
